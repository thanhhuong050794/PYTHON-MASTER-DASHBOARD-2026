[project]
name = "neu-bi-backend"
version = "0.1.0"
description = "BI Dashboard tuyển sinh NEU/PTIT — API FastAPI + MongoDB, đăng nhập & phân quyền theo đối tác"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymongo[srv]>=4.10",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
